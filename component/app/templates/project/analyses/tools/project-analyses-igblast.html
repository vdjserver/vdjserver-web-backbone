<div id="project-analyses-igblast-parameters" class="row">
    <div class="col">
        <form method="post" role="form" id="project-analyses-igblast-parameters-form"
              class="project-analyses-igblast-parameters-form needs-validation" novalidate>

            <div class="form-row align-items-center">
                <!--Adding Space for gap in front-->
                <div class="form-group col-md-3"></div>

                <!-- Species -->
                <div class="form-group col-md-2">
                    <label for="project-analyses-igblast-parameters-species-select">Species:</label>
                    <select class="selectpicker form-control form-control-igblast-species" name="species" id="project-analyses-igblast-parameters-species-select" {{#ifNot status "SUBMITTED"}}disabled{{/ifNot}}>
                        <optgroup label="Human">
                            {{#each species.human}}
                            <option id="{{this.id}}" value="{{this.label}}" {{#ifEquals ../value.species this.id}}selected{{/ifEquals}}>{{this.label}}</option>
                            {{/each}}
                        </optgroup>
                        <optgroup label="Mouse">
                            {{#each species.mouse}}
                            <option id="{{this.id}}" value="{{this.label}}" {{#ifEquals ../value.species this.id}}selected{{/ifEquals}}>{{this.label}}</option>
                            {{/each}}
                        </optgroup>
                        <optgroup label="Alpaca">
                            {{#each species.alpaca}}
                            <option id="{{this.id}}" value="{{this.label}}" {{#ifEquals ../value.species this.id}}selected{{/ifEquals}}>{{this.label}}</option>
                            {{/each}}
                        </optgroup>
                    </select>
                    <div class="invalid-feedback">
                        Please select a non-null Species.
                    </div>
                </div>

                <!-- Locus -->
                <div class="form-group col-md-1">
                    <label for="project-analyses-igblast-parameters-locus-select">Locus:</label>
                    <select id="project-analyses-igblast-parameters-locus-select" class="selectpicker form-control form-control-igblast" name="locus" {{#ifNot status "SUBMITTED"}}disabled{{/ifNot}}>
                        {{#each locus_enum}}
                            <option id="{{this}}" value="{{this}}" {{#ifEquals this ../value.locus}}selected{{/ifEquals}}>{{this}}</option>
                        {{/each}}
                    </select>
                </div>

                <!-- Germline Database -->
                <div class="form-group col-md-3">
                    <div id="ig-db-select">
                        <label for="project-analyses-igblast-parameters-germline-select-ig">Germline Database:</label>
                        <select class="selectpicker form-control form-control-igblast" name="germline_db" id="project-analyses-igblast-parameters-germline-select-ig" {{#ifNot status "SUBMITTED"}}disabled{{/ifNot}}>
                            {{#each germline_dbs}}
                                {{#ifEquals this.locus "IG"}}
                                    <option value="{{this.value}}" {{#ifEquals ../value.germline_db this.value}}selected{{/ifEquals}}>
                                        {{this.label}}
                                    </option>
                                {{/ifEquals}}
                            {{/each}}
                        </select>
                    </div>
                    <div id="tr-db-select">
                        <label for="project-analyses-igblast-parameters-germline-select-tr">Germline Database:</label>
                        <select class="selectpicker form-control form-control-igblast" name="germline_db" id="project-analyses-igblast-parameters-germline-select-tr" {{#ifNot status "SUBMITTED"}}disabled{{/ifNot}}>
                            {{#each germline_dbs}}
                                {{#ifEquals this.locus "TR"}}
                                    <option value="{{this.value}}" {{#ifEquals ../value.germline_db this.value}}selected{{/ifEquals}}>
                                        {{this.label}}
                                    </option>
                                {{/ifEquals}}
                            {{/each}}
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
